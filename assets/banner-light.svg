<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Ramtin Mojtahedi — Medical AI Researcher</title>
  <desc id="desc">A light banner with deep green, mint, and periwinkle accents, inspired by medical imaging and neural networks.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6fbf8"/>
      <stop offset=".55" stop-color="#eef7f2"/>
      <stop offset="1" stop-color="#f0f2ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#18815f"/>
      <stop offset="1" stop-color="#6377cf"/>
    </linearGradient>
    <radialGradient id="scan" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#6377cf" stop-opacity=".18"/>
      <stop offset=".52" stop-color="#18815f" stop-opacity=".07"/>
      <stop offset="1" stop-color="#18815f" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#6377cf" stroke-opacity=".06"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" rx="30" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="30" fill="url(#grid)"/>
  <path d="M0 330C250 280 380 390 635 340S965 235 1200 280V420H0Z" fill="#18815f" opacity=".035"/>
  <rect x="44" y="44" width="1112" height="332" rx="22" fill="none" stroke="#173e30" stroke-opacity=".13"/>

  <g transform="translate(760 36)">
    <circle cx="196" cy="174" r="165" fill="url(#scan)"/>
    <circle cx="196" cy="174" r="132" fill="none" stroke="#18815f" stroke-opacity=".22" stroke-width="1.5"/>
    <circle cx="196" cy="174" r="104" fill="none" stroke="#6377cf" stroke-opacity=".25"/>
    <circle cx="196" cy="174" r="76" fill="#f8fcfa" stroke="url(#accent)" stroke-width="2"/>
    <circle cx="196" cy="174" r="58" fill="none" stroke="#18815f" stroke-opacity=".2" stroke-dasharray="4 8"/>
    <text x="196" y="187" text-anchor="middle" fill="url(#accent)" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="41" font-weight="750" letter-spacing="3">RM</text>

    <g fill="#18815f" filter="url(#glow)">
      <circle cx="72" cy="102" r="4"/><circle cx="309" cy="91" r="4"/><circle cx="325" cy="243" r="4"/><circle cx="92" cy="267" r="4"/>
    </g>
    <g fill="none" stroke="#6377cf" stroke-opacity=".34">
      <path d="M72 102L139 132L166 109"/><path d="M309 91L255 127L281 169"/>
      <path d="M325 243L270 223L247 259"/><path d="M92 267L138 222L112 185"/>
    </g>
    <g fill="#6377cf">
      <circle cx="139" cy="132" r="3"/><circle cx="166" cy="109" r="3"/><circle cx="255" cy="127" r="3"/>
      <circle cx="281" cy="169" r="3"/><circle cx="270" cy="223" r="3"/><circle cx="247" cy="259" r="3"/>
      <circle cx="138" cy="222" r="3"/><circle cx="112" cy="185" r="3"/>
    </g>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="86" y="102" fill="#18815f" font-size="15" font-weight="700" letter-spacing="4">MEDICAL AI · RESEARCH · TRANSLATION</text>
    <text x="82" y="192" fill="#10271e" font-size="59" font-weight="800" letter-spacing="-2">Ramtin Mojtahedi</text>
    <rect x="84" y="218" width="570" height="4" rx="2" fill="url(#accent)"/>
    <text x="84" y="269" fill="#294b3e" font-size="24" font-weight="600">Postdoctoral Medical AI Researcher</text>
    <text x="84" y="311" fill="#52645c" font-size="18">Medical imaging · Foundation models · Multimodal prediction</text>
    <text x="84" y="343" fill="#52645c" font-size="18">Clinically grounded validation</text>
  </g>
</svg>
